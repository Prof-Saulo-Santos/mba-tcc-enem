global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "enem-api-local"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["enem-api:8000"]
        labels:
          environment: "local-docker"
          service: "enem-target-m4-api"

  # ---------------------------------------------------------------------------
  # Demonstração ao vivo no AWS ECS Express Mode (Cenário 1):
  # Descomente o bloco abaixo substituindo pelo domínio de `ecs_service_url`
  # (SEM https://) e reinicie o Prometheus:
  #   docker compose --profile monitoring restart prometheus
  # ---------------------------------------------------------------------------
